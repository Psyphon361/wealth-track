name: Dev data refresh

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '30 16 * * *'
    - cron: '45 16 * * *'
    - cron: '0 3 * * 1'
    - cron: '0 13 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Which import to run
        type: choice
        options: [all, securities, amfi, nps, issuers, gold, purge]
        default: all

permissions:
  contents: read

concurrency:
  group: dev-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          if [ -z "$DEV_DATABASE_URL" ]; then
            echo "::error::Secret DEV_DATABASE_URL is not set (Neon dev branch direct connection string)."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python 3.12 and dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r api/requirements.txt

      - name: Import securities (stock and bond masters)
        if: github.event.schedule == '0 14 * * *' || inputs.job == 'securities' || inputs.job == 'all'
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: ../.venv/bin/python -m app.jobs.securities_import

      - name: Import AMFI (MF master and NAVs)
        if: github.event.schedule == '30 16 * * *' || inputs.job == 'amfi' || inputs.job == 'all'
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: ../.venv/bin/python -m app.jobs.amfi_import

      - name: Import NPS (scheme master and NAVs)
        if: github.event.schedule == '45 16 * * *' || inputs.job == 'nps' || inputs.job == 'all'
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: ../.venv/bin/python -m app.jobs.nps_import

      - name: Import FD/RD issuers
        if: github.event.schedule == '0 3 * * 1' || inputs.job == 'issuers' || inputs.job == 'all'
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: ../.venv/bin/python -m app.jobs.issuers_import

      - name: Import IBJA gold rates
        if: github.event.schedule == '0 13 * * *' || inputs.job == 'gold' || inputs.job == 'all'
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: ../.venv/bin/python -m app.jobs.gold_import

      - name: Purge holdings deleted over 30 days ago
        if: github.event.schedule == '0 20 * * *' || inputs.job == 'purge' || inputs.job == 'all'
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: ../.venv/bin/python -m app.jobs.purge_deleted
