name: CI Web

# Report only: nothing depends on this workflow.
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/.npmrc has legacy-peer-deps=true; npm ci reads it.
      - run: npm ci

      # Next 16 supports typegen: generates the route types tsc needs.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test
