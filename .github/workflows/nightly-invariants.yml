name: Nightly invariants

# Read-only check of the dev data (api/scripts/invariants.sql). A violation fails the run.
# Runs an hour after the last dev-data-refresh job (purge, 20:00 UTC).
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-invariants
  cancel-in-progress: false

jobs:
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          if [ -z "$DEV_DATABASE_URL" ]; then
            echo "::error::Secret DEV_DATABASE_URL is not set (Neon dev branch direct connection string)."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python 3.12 and dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r api/requirements.txt

      - name: Check invariants
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: ../.venv/bin/python scripts/check_invariants.py
