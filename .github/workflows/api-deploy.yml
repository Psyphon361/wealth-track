name: API migrate and deploy

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::Secret PROD_DATABASE_URL is not set (Neon production direct connection string)."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python 3.12 and dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r api/requirements.txt

      - name: Run migrations
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: ../.venv/bin/alembic upgrade head

      - name: Show current revision
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: ../.venv/bin/alembic current

  deploy:
    runs-on: ubuntu-24.04
    needs: migrate
    steps:
      - name: Trigger Vercel API deploy hook
        env:
          VERCEL_API_DEPLOY_HOOK: ${{ secrets.VERCEL_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_API_DEPLOY_HOOK" ]; then
            echo "::error::Secret VERCEL_API_DEPLOY_HOOK is not set (Vercel API project deploy hook URL)."
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_API_DEPLOY_HOOK" > /dev/null
          echo "Deploy hook triggered."
